title: Agent Compass
tagline: Career research for Claude and Codex
description: Career research for Claude and Codex to find countries and job portals, estimate local salary targets and screen jobs against your profile.
url: "https://myowinthein.github.io"
baseurl: "/agent-compass"

remote_theme: just-the-docs/just-the-docs@latest
defaults:
  - scope:
      path: ""
      type: pages
    values:
      image:
        path: /docs/images/banner.jpg
        width: 1200
        height: 800
        alt: A traveller holding a compass and lantern under a starry sky
  - scope:
      path: "docs"
      type: pages
    values:
      layout: default
  - scope:
      path: "docs/commands"
      type: pages
    values:
      title_category: Command guide
  - scope:
      path: "docs/commands/country-finder"
      type: pages
    values:
      title_category: country-finder
  - scope:
      path: "docs/commands/salary-calculator"
      type: pages
    values:
      title_category: salary-calculator
  - scope:
      path: "docs/commands/portal-finder"
      type: pages
    values:
      title_category: portal-finder
  - scope:
      path: "docs/commands/job-screener"
      type: pages
    values:
      title_category: job-screener
  - scope:
      path: "docs/setup"
      type: pages
    values:
      title_category: Setup
  - scope:
      path: "docs/examples"
      type: pages
    values:
      title_category: Examples
  - scope:
      path: "docs/legal"
      type: pages
    values:
      nav_exclude: true

# Navigation
nav_sort: order
nav_external_links:
  - title: GitHub
    url: https://github.com/myowinthein/agent-compass
    hide_icon: false

nav_external_links_new_tab: false
aux_links_new_tab: false

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme

# Exclude non-site files from Jekyll processing
exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - CLAUDE.md
  - AGENTS.md
  - LICENSE
  - .gitignore
  - .DS_Store
  - .claude/
  - .codex-plugin/
  - agents/
  - data/
  - helpers/
  - prompts/
  - skills/
  - workflows/
  - scripts/
  - _plugins/
