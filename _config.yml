title: Agent Compass
description: Career research workflows for Claude and Codex.
url: "https://myowinthein.github.io"
baseurl: "/agent-compass"

remote_theme: just-the-docs/just-the-docs@v0.10.0
# Navigation
nav_sort: order
nav_external_links:
  - title: GitHub
    url: https://github.com/myowinthein/agent-compass
    hide_icon: false

# Footer
footer_content: "Agent Compass &mdash; MIT License"

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme

# Exclude non-site files from Jekyll processing
exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - CLAUDE.md
  - AGENTS.md
  - LICENSE
  - .gitignore
  - .DS_Store
  - .claude/
  - agents/
  - commands/
  - data/
  - prompts/
  - skills/
  - workflows/
  - scripts/
