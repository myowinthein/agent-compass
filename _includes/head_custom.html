<link rel="icon" type="image/svg+xml" href="https://myowin.dev/favicon.svg">
<script src="{{ '/assets/js/theme-switcher.js' | relative_url }}"></script>
{% if page.setup_tabs %}
<script src="{{ '/assets/js/setup-tabs.js' | relative_url }}" defer></script>
{% endif %}

<script type="module">
  const blocks = document.querySelectorAll('code.language-mermaid');
  if (blocks.length) {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs');
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });

    const nodes = [];
    blocks.forEach(block => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = block.textContent;
      block.closest('pre').replaceWith(div);
      nodes.push(div);
    });

    await mermaid.run({ nodes });
  }
</script>
