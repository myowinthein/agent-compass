name: Build and deploy docs

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  helpers:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test shared workflow helpers
        run: python -B scripts/test_compass.py

  build:
    needs: helpers
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: docs

      - name: Resolve the latest stable theme
        working-directory: docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          theme_tag=$(gh api repos/just-the-docs/just-the-docs/releases/latest --jq '.tag_name')
          [[ "$theme_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          COMPASS_THEME_TAG="$theme_tag" bundle exec ruby -ryaml -e '
            config = YAML.safe_load_file("_config.yml")
            config["remote_theme"] = "just-the-docs/just-the-docs@#{ENV.fetch("COMPASS_THEME_TAG")}"
            File.write("_config.yml", YAML.dump(config))
          '
          echo "Building with Just the Docs $theme_tag"

      - name: Validate and build the site
        run: bundle exec rake test
        env:
          JEKYLL_ENV: production
          BUNDLE_GEMFILE: ${{ github.workspace }}/docs/Gemfile

      - name: Upload the tested site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
