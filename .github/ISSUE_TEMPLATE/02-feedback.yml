name: Share feedback
description: Suggest an improvement or clearer guidance for Agent Compass.
body:
  - type: markdown
    attributes:
      value: |
        Reports are public. Remove API keys, resumes and personal job-search details from text, links and attachments.
  - type: textarea
    id: feedback
    attributes:
      label: What could be better?
      description: Describe the improvement or unclear passage and why it matters. Include the workflow or guide link when relevant.
      placeholder: I'd like a clearer explanation of how Country Finder separates remote work from sponsorship.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Share a possible solution or clearer wording, if you have one.
      placeholder: Add a worked example to the Country Finder guide.
    validations:
      required: false
