---
layout: null
---
{% assign redirect_url = page.redirect_to | relative_url %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  <link rel="canonical" href="{{ page.redirect_to | split: '#' | first | absolute_url }}">
  <script>
    const target = new URL({{ redirect_url | jsonify }}, window.location.href);
    if (['#install', '#update', '#uninstall'].includes(window.location.hash)) {
      target.hash += `-${window.location.hash.slice(1)}`;
    }
    window.location.replace(target.href);
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url={{ redirect_url | escape }}">
  </noscript>
</head>
<body>
  <p>This page has moved. <a href="{{ redirect_url | escape }}">Continue to the setup guide</a>.</p>
</body>
</html>
