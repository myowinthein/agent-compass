<link rel="icon" type="image/svg+xml" href="https://myowin.dev/favicon.svg">
<link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | relative_url }}">
<script src="{{ '/assets/js/theme-switcher.js' | relative_url }}?v={{ '/assets/js/theme-switcher.js' | asset_digest }}"></script>
{% if page.overview %}
<style>
  #site-nav:not([data-guide-nav-ready]) .nav-list-item:has(a[href="{{ page.overview | relative_url }}"]) > .nav-list {
    display: block;
  }
  #site-nav:not([data-guide-nav-ready]) a[href="{{ page.overview | relative_url }}"] {
    font-weight: 600;
    text-decoration: none;
  }
</style>
<script src="{{ '/assets/js/guide-nav.js' | relative_url }}?v={{ '/assets/js/guide-nav.js' | asset_digest }}" data-overview-url="{{ page.overview | relative_url }}" defer></script>
{% endif %}
{% if page.setup_tabs %}
<script src="{{ '/assets/js/setup-tabs.js' | relative_url }}?v={{ '/assets/js/setup-tabs.js' | asset_digest }}" defer></script>
{% endif %}

<script type="module">
  const blocks = document.querySelectorAll('code.language-mermaid');
  if (blocks.length) {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs');
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });

    const nodes = [];
    blocks.forEach(block => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = block.textContent;
      block.closest('pre').replaceWith(div);
      nodes.push(div);
    });

    await mermaid.run({ nodes });
  }
</script>
